name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bpc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-msrv:
    name: MSRV quality (Rust 1.85.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install declared MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal && rustup component add --toolchain 1.85.0 rustfmt clippy && rustup default 1.85.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --features axum --lib --test protocol --test axum_integration --test untrusted_input_properties
      - run: cargo test --locked --doc
      - run: node scripts/verify-node-interop.mjs
  live-loopback:
    name: live Redis and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BPC_TEST_REDIS_URL: redis://127.0.0.1:6379/
      BPC_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install declared MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal && rustup default 1.85.0
      - run: test "$(redis-cli -h 127.0.0.1 CONFIG GET maxmemory-policy | tail -n 1)" = noeviction
      - run: cargo test --locked --features live-integration --test live_backends
      - name: Configure isolated gateway smoke environment
        shell: bash
        run: |
          set -euo pipefail
          echo 'BPC_GATEWAY_MODE=development' >> "$GITHUB_ENV"
          echo 'BPC_GATEWAY_BIND_ADDR=127.0.0.1:8181' >> "$GITHUB_ENV"
          echo 'BPC_GATEWAY_AUDIENCE=bpc://localhost/development' >> "$GITHUB_ENV"
          echo 'BPC_GATEWAY_SIGNATURE_WINDOW_MS=1000' >> "$GITHUB_ENV"
          echo 'BPC_GATEWAY_POSTGRES_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres' >> "$GITHUB_ENV"
          echo 'BPC_GATEWAY_POSTGRES_SCHEMA=bpc_gateway_ci' >> "$GITHUB_ENV"
          echo 'BPC_GATEWAY_DATA_KEY_ID=gateway-ci-ephemeral' >> "$GITHUB_ENV"
          echo "BPC_GATEWAY_DATA_KEY_B64=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')" >> "$GITHUB_ENV"
          echo 'BPC_GATEWAY_REDIS_URL=redis://127.0.0.1:6379/' >> "$GITHUB_ENV"
          echo 'BPC_GATEWAY_REDIS_NAMESPACE=bpc-gateway-ci' >> "$GITHUB_ENV"
          echo 'BPC_GATEWAY_REDIS_MIN_REPLICA_ACKS=0' >> "$GITHUB_ENV"
          echo 'BPC_GATEWAY_ALLOW_INSECURE_LOOPBACK=true' >> "$GITHUB_ENV"
          echo 'BPC_GATEWAY_ANCHOR_POSTGRES_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres' >> "$GITHUB_ENV"
          echo 'BPC_GATEWAY_ANCHOR_SCHEMA=bpc_gateway_anchor_ci' >> "$GITHUB_ENV"
      - name: Run real BPC gateway process smoke test
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --features gateway --bin bpc-gateway
          ./target/release/bpc-gateway migrate
          if ./target/release/bpc-gateway initialize-replay --fenced; then
            echo 'new replay namespace unexpectedly skipped its mandatory quarantine'; exit 1
          fi
          for _ in $(seq 1 45); do sleep 1; done
          ./target/release/bpc-gateway serve > gateway.log 2>&1 & gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; cat gateway.log' EXIT
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8181/healthz >/dev/null && break; sleep 1; done
          curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8181/readyz | grep -qx 204
          BPC_GATEWAY_SMOKE=1 cargo test --locked --features gateway --test gateway_live
  live-postgres-tls:
    name: live verified PostgreSQL TLS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TLS_DIR: ${{ runner.temp }}/bpc-pg-tls
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install declared MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal && rustup default 1.85.0
      - name: Start CA-signed TLS-only PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TLS_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$TLS_DIR/ca.key" -out "$TLS_DIR/ca.crt" -days 1 -subj '/CN=BPC test CA'
          openssl req -newkey rsa:2048 -nodes -keyout "$TLS_DIR/server.key" -out "$TLS_DIR/server.csr" -subj '/CN=localhost'
          printf 'subjectAltName=DNS:localhost\n' > "$TLS_DIR/ext.cnf"
          openssl x509 -req -in "$TLS_DIR/server.csr" -CA "$TLS_DIR/ca.crt" -CAkey "$TLS_DIR/ca.key" -CAcreateserial -out "$TLS_DIR/server.crt" -days 1 -extfile "$TLS_DIR/ext.cnf"
          postgres_uid="$(docker run --rm postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea id -u postgres)"
          chown "$postgres_uid:$postgres_uid" "$TLS_DIR/server.key"; chmod 0600 "$TLS_DIR/server.key"
          docker run -d --name bpc-pg-tls -p 127.0.0.1:5433:5432 -e POSTGRES_PASSWORD=postgres -v "$TLS_DIR:/tls:ro" postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key -c ssl_ca_file=/tls/ca.crt
          for _ in $(seq 1 30); do docker exec bpc-pg-tls pg_isready -U postgres && exit 0; sleep 1; done; docker logs bpc-pg-tls; exit 1
      - name: Test chain and hostname verification
        env:
          SSL_CERT_FILE: ${{ runner.temp }}/bpc-pg-tls/ca.crt
          BPC_TEST_POSTGRES_TLS_URL: postgresql://postgres:postgres@localhost:5433/postgres?sslmode=verify-full
          BPC_TEST_POSTGRES_TLS_BAD_HOST_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres?sslmode=verify-full
        run: cargo test --locked --features live-integration --test postgres_tls
      - name: Remove TLS database
        if: always()
        run: docker rm -f bpc-pg-tls || true
  supply-chain:
    name: dependency policy (Rust 1.88.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install supply-chain toolchain
        run: rustup toolchain install 1.88.0 --profile minimal && rustup default 1.88.0
      - run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit
      - run: cargo install cargo-deny --version 0.20.2 --locked && cargo deny check all
