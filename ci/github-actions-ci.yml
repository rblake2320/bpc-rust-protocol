name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This workflow needs no write, package, deployment, or OIDC permissions.
permissions:
  contents: read

concurrency:
  group: bpc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BPC_TEST_REDIS_URL: redis://127.0.0.1:6379/
      BPC_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      # Commit pins are intentional: update them only in reviewed dependency PRs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - name: Lockfile and source integrity
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Assert replay-safe Redis policy
        run: test "$(redis-cli -h 127.0.0.1 CONFIG GET maxmemory-policy | tail -n 1)" = "noeviction"
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test all features including real services
        run: cargo test --locked --all-features --all-targets
      - name: Verify Rust outputs with independent Node WebCrypto
        run: node scripts/verify-node-interop.mjs
      - name: Scan Rust advisories
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
