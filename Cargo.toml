[package]
name = "bpc-protocol"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Rust implementation of the BPC (Bound Pair Credentials) v2 request-bound HTTP authentication protocol"
license = "MIT"
repository = "https://github.com/rblake2320/bpc-rust-protocol"
readme = "README.md"
keywords = ["authentication", "authorization", "ecdsa", "security", "protocol"]
categories = ["authentication", "cryptography", "web-programming"]
exclude = ["Cargo.toml.orig", "fuzz/**", "security-artifacts/**", "target/**"]

[features]
default = []
axum = ["dep:axum", "dep:http", "dep:tokio"]
redis-store = ["dep:redis", "dep:url"]
postgres-store = ["dep:aes-gcm", "dep:postgres", "dep:postgres_rustls", "dep:rustls-native-certs", "dep:tokio-rustls", "dep:url"]
reqwest-client = ["dep:reqwest"]
production = ["axum", "redis-store", "postgres-store", "reqwest-client"]
live-integration = ["redis-store", "postgres-store"]

[dependencies]
aes-gcm = { version = "0.10.3", optional = true }
axum = { version = "0.8.8", optional = true }
base64 = "0.22.1"
getrandom = { version = "0.2.17", features = ["js"] }
http = { version = "1.4.0", optional = true }
hkdf = "0.12.4"
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdsa"] }
postgres = { version = "0.19.12", features = ["with-serde_json-1"], optional = true }
postgres_rustls = { version = "0.1.1", optional = true }
rand_core = { version = "0.6.4", features = ["getrandom"] }
redis = { version = "0.32.7", features = ["tls-rustls"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"], optional = true }
rustls-native-certs = { version = "0.8.5", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tokio-rustls = { version = "0.26.1", optional = true }
uuid = { version = "1.18.1", features = ["v4", "serde", "js"] }
url = { version = "2.5.7", optional = true }
zeroize = "1.8.2"

[dev-dependencies]
futures-util = "0.3.31"
proptest = "1.10.0"
serde_json = "1.0.145"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
